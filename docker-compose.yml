version: '3.8'

services:
  proof-server:
    image: midnightntwrk/proof-server:latest
    container_name: midnight-proof-server
    ports:
      - "6300:6300"
    environment:
      - RUST_LOG=info
    restart: unless-stopped

  midnight-node:
    image: midnightntwrk/midnight-node:1.0.0
    container_name: midnight-standalone-node
    ports:
      - "9944:9944"
      - "9933:9933"
    environment:
      - RUST_LOG=info
    depends_on:
      - proof-server
    restart: unless-stopped

  indexer:
    image: midnightntwrk/indexer-standalone:4.3.3
    container_name: midnight-indexer
    ports:
      - "8088:8088"
    depends_on:
      - midnight-node
    restart: unless-stopped
